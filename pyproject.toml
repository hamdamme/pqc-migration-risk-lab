[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-risk-lab"
version = "0.1.0"
description = "A small, context-aware research prototype for PQC migration inventories"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Hamdam Aynazarov" }]
dependencies = []

[project.scripts]
pqc-risk-lab = "pqc_risk_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
